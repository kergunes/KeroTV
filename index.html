<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KeroTV</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand">Kero<span>TV</span></div>
      <div class="topbar-right"><span id="screenLabel">HOME</span><span id="clock">--:--</span></div>
    </header>
    <main id="screen" class="screen" aria-live="polite"></main>
    <footer class="footer">
      <span>Navigate <b>↑ ↓ ← →</b></span>
      <span>Select <b>OK / Enter</b></span>
      <span>Back <b>Return / Esc</b></span>
      <span id="inputMode">Keyboard ready</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
